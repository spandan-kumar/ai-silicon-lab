# riscv-formal configuration for the AI Silicon Lab RV32I multi-cycle core.
#
# The core implements the base integer set in machine mode with no CSRs, so
# there is no [csrs] section and no CSR checks are generated. Declaring CSRs
# the core does not have would generate proofs that pass vacuously.

[options]
isa rv32i
# boolector is riscv-formal's default and is not packaged for this host;
# z3 is installed and solves these obligations.
solver z3

[depth]
insn            10
reg        5    12
pc_fwd     5    12
pc_bwd     5    12
unique     1  5 12
causal     5    12
# Still generated and still run. It fails by design: see INAPPLICABLE in
# workspace/rv32i/formal/formal_collect.py for why, and note that the check
# is reported rather than removed.
liveness   1  5 15
cover      1    12

[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_ALIGNED_MEM

[defines liveness]
`define AISL_FAIRNESS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rv32i_core.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
